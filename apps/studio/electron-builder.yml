appId: dev.antelm.mmx-studio
productName: MMX Studio
copyright: Copyright © MMX

directories:
  output: dist
  buildResources: build

# main, preload and renderer are all fully bundled into out/ by Rollup + Vite,
# so nothing under node_modules is needed at runtime. Excluding it keeps the
# local `@mmx/*` development dependencies out of the packaged application.
files:
  - "out/**/*"
  - "package.json"
  - "!node_modules/**"

# Bundled app has no native modules to rebuild.
npmRebuild: false

win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}

mac:
  target: dmg
  category: public.app-category.developer-tools

linux:
  target: AppImage
  category: Development
