name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm fmt:check

      - name: Test
        run: pnpm test

      - name: Typecheck / compile packages
        run: pnpm build

      - name: Production web artifact
        if: ${{ env.MMX_PROJECT != '' }}
        run: pnpm build:web

      - uses: actions/upload-artifact@v4
        if: ${{ env.MMX_PROJECT != '' }}
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

  cross-repo-browser-e2e:
    name: Studio browser E2E
    runs-on: ubuntu-latest
    if: ${{ vars.MMX_STUDIO_E2E == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm playwright:install

      - name: Build core and Studio
        run: pnpm build

      - name: Strict Studio browser boot
        run: pnpm test:cross-repo
