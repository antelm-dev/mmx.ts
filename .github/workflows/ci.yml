name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm fmt:check

      - name: Test
        run: pnpm test

      - name: Generated levels
        run: pnpm level:check

      - name: Typecheck / compile packages
        run: pnpm build

      - name: Production web artifact
        if: ${{ env.MMX_PROJECT != '' }}
        run: pnpm build:web

      - uses: actions/upload-artifact@v4
        if: ${{ env.MMX_PROJECT != '' }}
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

  cross-repo-browser-e2e:
    name: Cross-repo browser E2E
    runs-on: ubuntu-latest
    if: ${{ vars.MMX_STUDIO_REPO != '' }}
    steps:
      - name: Checkout core
        uses: actions/checkout@v5

      - name: Checkout Studio fixture
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.MMX_STUDIO_REPO }}
          ref: ${{ vars.MMX_STUDIO_REF }}
          path: mmx-studio
          token: ${{ secrets.MMX_STUDIO_TOKEN || github.token }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install core dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm playwright:install

      - name: Build core
        run: pnpm build

      - name: Install Studio dependencies
        working-directory: mmx-studio
        run: pnpm install --frozen-lockfile

      - name: Build Studio packages used by prepare
        working-directory: mmx-studio
        run: pnpm exec turbo run build --filter=@mmx/starter-template --filter=@mmx/project-io

      - name: Strict cross-repo browser boot
        env:
          MMX_STUDIO_ROOT: ${{ github.workspace }}/mmx-studio
        run: pnpm test:cross-repo
